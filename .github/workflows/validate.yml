name: Validate widgets
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node bin/check-catalog.mjs --download
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash host/test-ai-core.sh
      - run: bash host/test-task.sh
